<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XuanLabs | Coming Soon</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    /* Animated Gradient Background */
    .bg-anim {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center,
          #111, #090909, #050505);
      animation: slowMove 25s linear infinite;
      opacity: 0.6;
      z-index: -1;
    }

    @keyframes slowMove {
      0% { transform: translate(-10%, -10%); }
      50% { transform: translate(10%, 10%); }
      100% { transform: translate(-10%, -10%); }
    }

    /* Floating Stars */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from { transform: scale(1); opacity: 0.4; }
      to { transform: scale(1.4); opacity: 1; }
    }

    /* Center Content */
    .main-box {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #eaeaea;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subtext {
      margin-top: 12px;
      font-size: 1.2rem;
      color: #bdbdbd;
      animation: fadeIn 3s ease;
    }

    /* Bottom bounce arrow */
    .down-arrow {
      margin-top: 30px;
      width: 30px;
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
  </style>
</head>

<body>
  <div class="bg-anim"></div>

  <!-- Auto-created stars -->
  <script>
    for (let i = 0; i < 60; i++) {
      let star = document.createElement("div");
      star.className = "star";
      star.style.top = Math.random() * 100 + "vh";
      star.style.left = Math.random() * 100 + "vw";
      star.style.animationDuration = 1.5 + Math.random() * 2 + "s";
      document.body.appendChild(star);
    }
  </script>

  <div class="main-box">
    <!-- XuanLabs SVG Logo -->
    <svg width="120" height="120" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="40" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <circle cx="50" cy="50" r="4" fill="#ffffff"/>
      <line x1="50" y1="10" x2="50" y2="90" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <line x1="10" y1="50" x2="90" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    </svg>

    <h1>XUANLABS</h1>
    <div class="subtext">A new creative universe is forming...</div>
    <div class="subtext">Launching Soon. Stay in orbit 🪐</div>
<svg class="down-arrow" width="32" height="32" viewBox="0 0 24 24" fill="none">
  <path d="M12 5v14M5 12l7 7 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
  </div>

</body>
</html>
